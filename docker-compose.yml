services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      - APP_NAME=xAI CMS
      - APP_URL=http://localhost:8080
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=xaicms
      - DB_USERNAME=xaicms
      - DB_PASSWORD=xaicms
      - AI_PROVIDER=deepseek
      - AI_API_KEY=
      - AI_BASE_URL=https://api.deepseek.com/v1
      - AI_MODEL=deepseek-v4-flash
      - AI_PRO_MODEL=deepseek-v4-pro
    volumes:
      - ./public/uploads:/var/www/html/public/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: xaicms
      MYSQL_USER: xaicms
      MYSQL_PASSWORD: xaicms
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/database.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
